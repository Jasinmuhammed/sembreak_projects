<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">
        <h1>Password Generator</h1>
            <!--password container-->
        <div class="password-container">
            <input type="text" readonly id="password">
            <i class="far fa-copy" id ="copy-btn" title="copy to clipbord"></i>
        </div>


        <!--options-->
    </div>
    <div class="options">
        <!--password length-->
        <div class="option">
            <label for="length">password length</label>
            <div class="range-container">
                <input type="range" id="length"min="6" max="24" value="12">
                <span id="length-value">12</span>
            </div>
        </div>
        <!--include uppercase-->
        <div class="inclue-uppercase">
            <label for="uppercase">Include uppercase</label>
            <input type="checkbox" id="uppercase" checked>
        </div>
                <!--include lowercase-->
        <div class="inclue-lowercase">
            <label for="lowercase">Include lowercase</label>
            <input type="checkbox" id="lowercase" checked>
        </div>

                <!--include numbers-->
        <div class="inclue-numbers">
            <label for="numbers">Include numbers</label>
            <input type="checkbox" id="numbers" checked>
        </div>

                <!--include symbols-->
        <div class="inclue-symbols">
            <label for="uppercase">Include symbols</label>
            <input type="checkbox" id="symbols" checked>
        </div>
        <button id="generate-btn">
            <i class="fas fa-key"></i>
            Generate Password
        </button>

        <div class="strength-container">
            <p>password strength: <span id="strength-label">Medium</span></p>

            <div class="strength-bar"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
